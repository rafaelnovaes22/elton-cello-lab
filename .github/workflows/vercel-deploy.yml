name: vercel-deploy
on:
  push:
    branches: [codex/elton-cello-lab]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx -y vercel@latest deploy --prod --yes --scope consultoria-bethesda --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_pEubwerNlvAH8LlZ5sdAAdgV
          VERCEL_PROJECT_ID: prj_EbRDE0jJXLXl3ZRrNUWTJpxkPmIr
